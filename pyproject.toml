# This pyproject.toml exists solely to host the test harness for scripts
# shipped inside skills (e.g. markdown-format/scripts/align_tables.py).
# It is NOT a distributable Python project — the skills themselves remain
# self-contained directories per the Agent Skills spec.

[project]
name = "zachvictor-skills-tests"
version = "0.0.0"
description = "Test harness for scripts inside the skills in this repo."
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest~=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skill scripts are not importable packages — each skill directory is
# self-contained for distribution. Declaring the script directories here (paths
# are relative to rootdir) lets the tests import them by module name without a
# conftest.py mutating sys.path at collection time.
pythonpath = ["markdown-format/scripts", "pypi-version-check/scripts"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF"]
